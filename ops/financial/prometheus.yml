global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: gateway
    scheme: https
    tls_config:
      ca_file: /pilot/ca.pem
      cert_file: /pilot/unauthorized.pem
      key_file: /pilot/unauthorized.key
      server_name: gateway
    static_configs:
      - targets: ['gateway:9443']
