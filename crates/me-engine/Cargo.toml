[package]
name = "me-engine"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
me-core = { workspace = true }
me-book = { workspace = true }
me-metrics = { workspace = true }
me-clock = { workspace = true }
me-risk = { workspace = true }
me-audit = { workspace = true }
me-persist = { workspace = true }
crossbeam-channel = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
me-persist = { workspace = true }
proptest = { workspace = true }

[features]
financial = ["dep:me-financial", "dep:uuid", "dep:serde_json"]

[dependencies.me-financial]
path = "../me-financial"
optional = true
[dependencies.uuid]
version = "1"
features = ["serde", "v4"]
optional = true
[dependencies.serde_json]
workspace = true
optional = true
