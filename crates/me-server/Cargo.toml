[package]
name = "me-server"
version = "0.1.0"
edition = "2021"
description = "Matching engine binary — TCP + UDS server"

[[bin]]
name = "me-server"
path = "src/main.rs"

[features]
tls = ["me-io/tls", "dep:tokio-rustls", "dep:rustls-pemfile"]

[dependencies]
me-core = { workspace = true }
me-engine = { workspace = true }
me-io = { workspace = true }
me-metrics = { workspace = true }
me-persist = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Optional TLS support (enabled by --features tls)
tokio-rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
