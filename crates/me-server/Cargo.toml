[package]
name = "me-server"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true
description = "Matching engine binary — TCP + UDS server"

[[bin]]
name = "me-server"
path = "src/main.rs"

[features]
tls = ["me-io/tls", "dep:tokio-rustls"]

[dependencies]
me-core = { workspace = true }
me-engine = { workspace = true }
me-risk = { workspace = true }
me-io = { workspace = true }
me-metrics = { workspace = true }
me-persist = { workspace = true }
me-clock = { workspace = true }
me-audit = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Optional TLS support (enabled by --features tls)
tokio-rustls = { workspace = true, optional = true }
