name: CI

on:
  push:
    branches: [main, master, codex/financial-pilot]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo build --release --workspace --all-features --locked
      - run: cargo build -p me-datagen
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p me-server --features tls --locked
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: python3 scripts/runtime_smoke.py
        env:
          ME_TEST_TLS: "1"
      - run: python3 -m unittest discover -s examples/python
      - run: cargo test --manifest-path examples/rust/Cargo.toml --locked

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: cd clients/go/meclient && go test -race ./...
      - run: cd examples/go && go test ./...

  audit:
    name: Cargo Audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: ${{ runner.os }}-cargo-audit
      - name: Install cargo-audit
        run: |
          if ! cargo audit --version >/dev/null 2>&1; then
            cargo install cargo-audit --locked --force
          fi
      - run: cargo audit

  typescript-example:
    name: TypeScript protocol integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
        working-directory: examples/typescript
      - run: npm test
        working-directory: examples/typescript

  docker:
    name: Docker build and readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t matching-engine:ci .
      - name: Check container readiness
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name matching-engine-smoke matching-engine:ci
          trap 'docker logs matching-engine-smoke; docker rm -f matching-engine-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec matching-engine-smoke curl --fail --silent http://127.0.0.1:8080/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  financial:
    name: PostgreSQL financial recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: financial_test
          POSTGRES_USER: financial_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financial_test -d financial_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      LEDGER_TEST_DATABASE_URL: postgres://financial_test:ephemeral-ci-only@127.0.0.1:5432/financial_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-financial-${{ hashFiles('**/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client openssl
      - run: cargo test -p me-ledger --test postgres --locked -- --ignored
      - run: cargo build -p me-server -p me-gateway --features me-server/financial --locked
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/financial-smoke.py --output "$RUNNER_TEMP/financial-smoke"
      - run: python3 scripts/financial-faults.py --output "$RUNNER_TEMP/financial-faults"
      - run: python3 scripts/financial-matrix.py --output "$RUNNER_TEMP/financial-matrix"
      - run: python3 scripts/financial-soak.py --bin-dir target/debug --seconds 30 --output "$RUNNER_TEMP/financial-soak"
      - run: docker build -t matching-engine:financial-pilot .
      - run: python3 scripts/financial-disk-smoke.py --output "$RUNNER_TEMP/financial-disk"
      - run: python3 scripts/financial-compose-smoke.py --output "$RUNNER_TEMP/financial-ops"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-test-report
          path: |
            ${{ runner.temp }}/financial-smoke/report.json
            ${{ runner.temp }}/financial-soak/report.json
            ${{ runner.temp }}/financial-faults/report.json
            ${{ runner.temp }}/financial-matrix/report.json
            ${{ runner.temp }}/financial-disk/report.json
            ${{ runner.temp }}/financial-ops/report.json

  fuzz-smoke:
    name: Decoder fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: mkdir -p "$RUNNER_TEMP/fuzz-pending" "$RUNNER_TEMP/fuzz-active"
      - run: cargo fuzz run decode_frame "$RUNNER_TEMP/fuzz-pending" -- -max_total_time=10
        working-directory: crates/me-io/fuzz
      - run: cargo fuzz run decode_frame_handshaked "$RUNNER_TEMP/fuzz-active" -- -max_total_time=10
        working-directory: crates/me-io/fuzz
