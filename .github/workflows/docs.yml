name: Deploy project site and handbook

on:
  push:
    branches: [master, main]
    paths:
      - 'README.md'
      - 'scripts/*assemble_site.py'
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/*assemble_site.py'
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout project site kit
        uses: actions/checkout@v4
        with:
          repository: rekurt/rekurt.github.io
          ref: 113341cda801398021e6a155681a9e7fe3ccf715
          path: .family

      - uses: actions/setup-go@v5
        with:
          go-version-file: .family/go.mod
          cache-dependency-path: .family/go.sum

      - name: Install mdBook
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin

      - name: Build documentation
        run: mdbook build

      - name: Verify and generate handbook search metadata
        run: |
          python3 -m unittest discover -s docs -p test_seo.py
          python3 docs/seo.py docs/book

      - name: Build project site
        working-directory: .family
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/catalog-sync sync --manifest catalog/projects.yaml --snapshot site/src/data/generated/catalog.json --audit docs/repository-audit.md
          go run ./cmd/project-site build --slug matching-engine --snapshot site/src/data/generated/catalog.json --repo .. --out ../target/site --base-url https://rekurt.github.io/matching-engine/
          go run ./cmd/project-site validate --slug matching-engine --snapshot site/src/data/generated/catalog.json --repo .. --out ../target/site --base-url https://rekurt.github.io/matching-engine/

      - name: Include handbook and legacy redirects
        run: |
          python3 -m unittest discover -s scripts -p test_assemble_site.py
          python3 scripts/assemble_site.py --site target/site

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: project-site
          path: target/site
          if-no-files-found: error

      - name: Check existing Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          enabled = False
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  site = json.load(response)
              enabled = site.get("build_type") == "workflow"
              if not enabled:
                  print("::notice::Pages uses a different deployment source; documentation artifact is available.")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("::notice::Pages is not configured; documentation artifact is available. No site was created.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
