[workspace]
resolver = "2"
members = [
    "crates/me-core",
    "crates/me-book",
    "crates/me-engine",
    "crates/me-persist",
    "crates/me-io",
    "crates/me-bench",
]

[workspace.dependencies]
me-core = { path = "crates/me-core" }
me-book = { path = "crates/me-book" }
me-engine = { path = "crates/me-engine" }
me-persist = { path = "crates/me-persist" }
me-io = { path = "crates/me-io" }
rustc-hash = "2.1"
crossbeam-channel = "0.5"
bincode = "2.0.0-rc.3"
crc32fast = "1.4"
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util", "macros"] }
bytes = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
