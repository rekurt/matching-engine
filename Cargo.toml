[workspace]
resolver = "2"
members = [
    "crates/me-core",
    "crates/me-book",
    "crates/me-engine",
    "crates/me-persist",
    "crates/me-io",
    "crates/me-bench",
    "crates/me-datagen",
    "crates/me-server",
    "crates/me-metrics",
]

[workspace.dependencies]
me-core = { path = "crates/me-core" }
me-book = { path = "crates/me-book" }
me-engine = { path = "crates/me-engine" }
me-metrics = { path = "crates/me-metrics" }
me-persist = { path = "crates/me-persist" }
me-io = { path = "crates/me-io" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rustc-hash = "2.1"
crossbeam-channel = "0.5"
bincode = "2.0.0-rc.3"
crc32fast = "1.4"
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util", "macros", "sync", "signal"] }
bytes = "1"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
