[workspace]
resolver = "2"
members = [
    "crates/me-core",
    "crates/me-book",
    "crates/me-engine",
    "crates/me-persist",
    "crates/me-io",
    "crates/me-bench",
    "crates/me-datagen",
    "crates/me-server",
    "crates/me-metrics",
    "crates/me-risk",
    "crates/me-audit",
    "crates/me-clock",
    "crates/me-ledger",
    "crates/me-financial",
    "crates/me-gateway",
]
exclude = ["examples/rust", "crates/me-io/fuzz"]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/rekurt/matching-engine"
authors = ["nikita42 (rekurt)"]
readme = "README.md"
rust-version = "1.96"
description = "Spot order matching service with durable session recovery"

[workspace.dependencies]
me-core = { path = "crates/me-core" }
me-book = { path = "crates/me-book" }
me-engine = { path = "crates/me-engine" }
me-metrics = { path = "crates/me-metrics" }
me-persist = { path = "crates/me-persist" }
me-io = { path = "crates/me-io" }
me-risk = { path = "crates/me-risk" }
me-audit = { path = "crates/me-audit" }
me-clock = { path = "crates/me-clock" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rustc-hash = "2.1"
crossbeam-channel = "0.5"
crc32fast = "1.4"
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util", "macros", "sync", "signal", "time"] }
tokio-rustls = "0.26"
bytes = "1"
# default features pull in `protobuf` (RUSTSEC-2024-0437); we only use the text
# exposition format (TextEncoder), so disable defaults to drop that dependency.
prometheus = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
