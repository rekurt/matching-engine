[book]
title = "matching-engine"
authors = ["nikita42 (rekurt)"]
description = "Spot matching service: integration and operations"
src = "docs/src"
language = "en"

[build]
build-dir = "docs/book"
create-missing = false

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/rekurt/matching-engine"
edit-url-template = "https://github.com/rekurt/matching-engine/edit/master/{path}"
search.enable = true
search.limit-results = 30

site-url = "/matching-engine/docs/"
